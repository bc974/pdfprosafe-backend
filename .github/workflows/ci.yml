name: CI

# Gate every push/PR to main: Render auto-deploys main, so a broken commit
# would otherwise ship straight to production. This runs the offline smoke test
# (parse a sample PDF → build .docx/.xlsx) before that can happen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke • Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          for f in lib/*.js scripts/*.mjs; do node --check "$f"; done

      - name: Smoke test (offline conversion)
        run: npm run smoke
